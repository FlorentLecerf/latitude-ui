<!DOCTYPE html>
<html lang="fr">
<!--
  Carrousel Instagram / Facebook, STYLE PERFORMANCE, REGISTRE FIN (DA du 23/11/2026, ../../DESIGN.md).
  Format : instagram-portrait (1080 × 1350). Gabarit de référence : ../banners/linkedin-perso-performance.html.
  Le texte vient de latitude-marque (editorial/posts/...) ; il est recopié dans un fichier de données data/<slug>.js.
  Adresse : #d=<slug>&n=<numéro de slide>&ton=sombre|clair
  Le décor « courbe » vit dans une bande au bas de la slide ; le réalisé avance de slide en slide (n / total) et
  atteint la cible sur la dernière ; la cible et la trajectoire en pointillé sont tracées dès la première.
  RENDU : bun rendre-carrousel.ts <slug> [clair]   (depuis brand/carrousels/)
-->
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'DM Serif Display';src:url('../tools/fonts/DMSerifDisplay-Regular.ttf') format('truetype');font-weight:400;font-display:block;}
  @font-face{font-family:'DM Sans';src:url('../tools/fonts/dm-sans-500.woff') format('woff');font-weight:500;font-display:block;}
  @font-face{font-family:'DM Sans';src:url('../tools/fonts/dm-sans-700.woff') format('woff');font-weight:700;font-display:block;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;}
  :root{--fd:#232220;--tr:#F5F0EB;--doux:#C9C1B8;--k:1;--terra:#E07855;}
  body.clair{--fd:#F5F0EB;--tr:#2E2D2B;--doux:#6E6A66;--k:1.6;--terra-txt:#A8492E;}
  .s{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--fd);font-family:'DM Sans',sans-serif;color:var(--tr);}
  svg.deco{position:absolute;inset:0;}
  .wordmark{position:absolute;top:72px;left:88px;font-family:'DM Serif Display',serif;font-size:44px;letter-spacing:-0.01em;}
  .wordmark .dot{color:var(--terra);}
  .num{position:absolute;top:90px;right:88px;font-weight:500;font-size:16px;letter-spacing:.22em;color:var(--doux);}
  .zone{position:absolute;left:88px;right:88px;top:230px;height:660px;display:flex;flex-direction:column;justify-content:center;}
  .ter{color:var(--terra);}
  body.clair .ter{color:var(--terra-txt);}
  .cover h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:84px;line-height:1.06;letter-spacing:-0.015em;}
  .cover .sub{margin-top:44px;font-weight:500;font-size:34px;line-height:1.4;color:var(--doux);}
  .glisse{margin-top:64px;display:flex;align-items:center;gap:20px;font-weight:700;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);}
  body.clair .glisse{color:var(--terra-txt);}
  .glisse .filet{width:72px;height:1.5px;background:currentColor;}
  .ed .filet-h,.qt .filet-h{width:64px;height:2px;background:var(--terra);margin-bottom:44px;}
  .ed h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:70px;line-height:1.1;letter-spacing:-0.01em;}
  .ed p{margin-top:44px;font-weight:500;font-size:36px;line-height:1.5;color:var(--doux);}
  .ed p q{quotes:"« " " »";color:var(--tr);}
  .qt{align-items:flex-start;}
  .qt .guil{font-family:'DM Serif Display',serif;font-size:150px;line-height:1;color:var(--terra);height:96px;margin-bottom:8px;}
  .qt blockquote{font-family:'DM Serif Display',serif;font-size:72px;line-height:1.14;letter-spacing:-0.01em;}
  .qt blockquote .suite{display:block;margin-top:40px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:36px;line-height:1.45;color:var(--doux);letter-spacing:0;}
  .avatar{position:absolute;right:30px;bottom:86px;height:780px;z-index:2;filter:drop-shadow(0 0 1px rgba(245,240,235,.35));}
  .zone.avec-avatar{right:470px;}
  .zone.avec-avatar.ed h2{font-size:58px;}
  .zone.avec-avatar.ed p{font-size:33px;}
  .leg{position:absolute;font-weight:500;font-size:14px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;color:var(--terra);}
</style>
</head>
<body>
<div class="s" id="s">
  <svg class="deco" id="deco" viewBox="0 0 1080 1350"></svg>
  <div class="wordmark">Latitude<span class="dot">.</span></div>
  <div class="num" id="num"></div>
  <div class="zone" id="zone"></div>
  <div class="leg" id="l1">Le dirigeant</div>
</div>
<script>
const P = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(x => x.split("=").map(decodeURIComponent)));
const ton = P.ton || "sombre";
if (ton === "clair") document.body.classList.add("clair");
const sc = document.createElement("script");
sc.src = "data/" + P.d + ".js";
sc.onload = () => rendre(window.CARROUSEL, parseInt(P.n || "1", 10));
document.head.appendChild(sc);

const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
// *entre étoiles* = accent terracotta en couleur de texte ; «…» = citation
const fmt = (t) => esc(t).replace(/\*(.+?)\*/g, '<span class="ter">$1</span>').replace(/«\s?(.+?)\s?»/g, "<q>$1</q>");

function rendre(C, n) {
  const total = C.slides.length, sl = C.slides[n - 1], z = document.getElementById("zone");
  document.getElementById("num").textContent = String(n).padStart(2, "0") + " / " + String(total).padStart(2, "0");
  if (sl.type === "cover") {
    z.className = "zone cover";
    z.innerHTML = `<h1>${fmt(sl.titre)}</h1>` + (sl.sousTitre ? `<div class="sub">${fmt(sl.sousTitre)}</div>` : "") +
      (sl.repere ? `<div class="glisse"><span>${esc(sl.repere)}</span><span class="filet"></span><span>&#8594;</span></div>` : "");
  } else if (sl.type === "editorial") {
    z.className = "zone ed";
    z.innerHTML = `<div class="filet-h"></div><h2>${fmt(sl.titre)}</h2><p>${fmt(sl.corps)}</p>`;
  } else {
    z.className = "zone qt";
    z.innerHTML = (sl.type === "question" ? "" : `<div class="filet-h"></div>`) + `<blockquote>${fmt(sl.texte)}${sl.suite ? `<span class="suite">${fmt(sl.suite)}</span>` : ""}</blockquote>`;
  }
  if (sl.avatar) {
    z.classList.add("avec-avatar");
    const im = document.createElement("img"); im.className = "avatar"; im.src = "avatar/avatar-" + sl.avatar + ".png";
    document.getElementById("s").appendChild(im);
  }
  decor(total > 1 ? 0.25 + 0.75 * (n - 1) / (total - 1) : 1, n === total);
}

function decor(avance, dernier) {
  const cs = getComputedStyle(document.body), TR = cs.getPropertyValue("--tr").trim(), K = parseFloat(cs.getPropertyValue("--k")),
        FD = cs.getPropertyValue("--fd").trim(), DOUX = cs.getPropertyValue("--doux").trim(), TERRA = "#E07855", clair = ton === "clair";
  const W = 1080, H = 1350, NS = "http://www.w3.org/2000/svg", s = document.getElementById("deco");
  const el = (n, a, p = s) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const line = (x1, y1, x2, y2, op, w = 1, dash) => el("line", Object.assign({ x1, y1, x2, y2, stroke: TR, "stroke-opacity": op, "stroke-width": w }, dash ? { "stroke-dasharray": dash } : {}));
  const defs = el("defs", {});

  // lueur terracotta très douce, en bas à droite, derrière le graphique
  const rg = el("radialGradient", { id: "lu", cx: "88%", cy: "80%", r: "45%" }, defs);
  el("stop", { offset: 0, "stop-color": TERRA, "stop-opacity": clair ? 0.07 : 0.12 }, rg);
  el("stop", { offset: 1, "stop-color": TERRA, "stop-opacity": 0 }, rg);
  el("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#lu)" });

  // la bande du décor : sous les textes, jamais derrière une phrase
  const X0 = 88, X1 = 880, Y0 = 1262, YT = 960, HH = Y0 - YT - 30;
  for (let y = Y0, i = 0; y >= YT; y -= 60, i++) line(i === 0 ? X0 - 20 : 640, y, W, y, (i === 0 ? 0.22 : 0.06) * K, 1);
  for (let x = X0 - 20, i = 0; x <= W; x += 18, i++) line(x, Y0, x, Y0 + (i % 5 ? 5 : 11), 0.22 * K, 1);

  // deux séries lisses : le dirigeant devant, l'entreprise qui suit, plus bas et en retard
  const N = 40, RET = 4, f = (u) => Math.pow(Math.max(0, u), 2.7), ux = (i) => i / (N - 1);
  const dir = Array.from({ length: N }, (_, i) => [X0 + ux(i) * (X1 - X0), Y0 - 16 - HH * f(ux(i))]);
  const ent = Array.from({ length: N }, (_, i) => [X0 + ux(i) * (X1 - X0), Y0 - 8 - HH * 0.72 * f(ux(i - RET))]);
  const lisse = (p) => { let d = `M${p[0][0]} ${p[0][1]}`; for (let i = 0; i < p.length - 1; i++) {
    const a = p[Math.max(0, i - 1)], b = p[i], c = p[i + 1], e = p[Math.min(p.length - 1, i + 2)], t = 6;
    d += ` C${b[0] + (c[0] - a[0]) / t} ${b[1] + (c[1] - a[1]) / t} ${c[0] - (e[0] - b[0]) / t} ${c[1] - (e[1] - b[1]) / t} ${c[0]} ${c[1]}`; } return d; };
  // le réalisé s'arrête à « avance » de son parcours
  const coupe = (p) => p.slice(0, Math.max(2, Math.round(avance * (N - 1)) + 1));
  const d = coupe(dir), e = coupe(ent), fin = d[d.length - 1], cible = [X1 + 70, YT - 40];

  // l'objectif, tracé dès la première slide : trajectoire en pointillé très léger + cible + ligne jusqu'à l'échelle
  el("path", { d: lisse(dir) + ` Q${dir[N - 1][0] + 30} ${dir[N - 1][1] - 30} ${cible[0]} ${cible[1]}`, fill: "none", stroke: TR, "stroke-opacity": 0.14 * K, "stroke-width": 1, "stroke-dasharray": "2 6", "stroke-linecap": "round" });
  el("circle", { cx: cible[0], cy: cible[1], r: 9, fill: "none", stroke: TERRA, "stroke-width": 1.25, "stroke-dasharray": dernier ? "none" : "2 3" });
  el("circle", { cx: cible[0], cy: cible[1], r: 2.5, fill: TERRA });
  line(cible[0], cible[1] + 12, cible[0], Y0, 0.3 * K, 1, "3 5");

  // aire légère sous le réalisé du dirigeant
  const ga = el("linearGradient", { id: "aire", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: 0, "stop-color": TERRA, "stop-opacity": clair ? 0.14 : 0.2 }, ga);
  el("stop", { offset: 1, "stop-color": TERRA, "stop-opacity": 0 }, ga);
  el("path", { d: lisse(d) + ` L${fin[0]} ${Y0} L${X0} ${Y0} Z`, fill: "url(#aire)" });

  // l'entreprise, en gris crème, et son nom écrit le long de sa pente
  el("path", { id: "pe", d: lisse(e), fill: "none", stroke: TR, "stroke-opacity": 0.45 * Math.min(1, K), "stroke-width": 1.5, "stroke-linecap": "round" });
  const te = el("text", { "font-family": "DM Sans", "font-weight": 500, "font-size": 14, "letter-spacing": "2.6", fill: DOUX, dy: 22 });
  // le nom finit à 200 px avant le bout du réalisé, sans jamais déborder du trait
  const lg = document.getElementById("pe").getTotalLength();
  const tp = el("textPath", { href: "#pe", startOffset: Math.max(12, lg - 210) }, te); tp.textContent = "L'ENTREPRISE";

  // sur la dernière slide, le dirigeant atteint la cible, puis l'entreprise le rejoint en pointillé, par en dessous
  if (dernier) {
    el("path", { d: `M${fin[0]} ${fin[1]} Q${fin[0] + 30} ${fin[1] - 30} ${cible[0]} ${cible[1]}`, fill: "none", stroke: TERRA, "stroke-opacity": 0.8, "stroke-width": 1.5, "stroke-dasharray": "2 5", "stroke-linecap": "round" });
    const eF = e[e.length - 1];
    el("path", { d: `M${eF[0]} ${eF[1]} Q${eF[0] + 40} ${eF[1] - 70} ${cible[0]} ${cible[1] + 10}`, fill: "none", stroke: TR, "stroke-opacity": 0.6 * Math.min(1, K), "stroke-width": 1.25, "stroke-dasharray": "2 5", "stroke-linecap": "round" });
  }
  el("path", { d: lisse(d), fill: "none", stroke: TERRA, "stroke-width": 2.5, "stroke-linecap": "round" });

  // un seul repère, au bout du réalisé
  line(fin[0], fin[1] + 12, fin[0], Y0, 0.3 * K, 1, "2 4");
  el("circle", { cx: fin[0], cy: fin[1], r: 13, fill: TERRA, "fill-opacity": 0.15 });
  el("circle", { cx: fin[0], cy: fin[1], r: 5.5, fill: FD, stroke: TERRA, "stroke-width": 2.25 });

  // « Le dirigeant », collé à sa courbe, au-dessus du repère
  const l1 = document.getElementById("l1");
  if (fin[0] > 700 || document.querySelector(".avatar")) { l1.style.left = (fin[0] - 196) + "px"; l1.style.top = (fin[1] - 34) + "px"; }
  else { l1.style.left = (fin[0] - 70) + "px"; l1.style.top = (fin[1] - 44) + "px"; }
}
</script>
</body>
</html>
