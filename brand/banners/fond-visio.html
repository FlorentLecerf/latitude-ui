<!DOCTYPE html>
<html lang="fr">
<!--
  Fond virtuel de visio (Google Meet, Zoom, Teams) · marque Latitude, style « performance ».
  Format : visio-background (1920 × 1080) — cf. ../format-registry.json
  Deux tons : fond-visio.html (sombre, par défaut) et fond-visio.html?ton=clair.

  Composition : Florent occupe le centre et le bas du cadre. Le wordmark vit en haut à gauche,
  le décor (règle graduée, objectif en pointillé, courbe terracotta qui monte) dans le tiers droit,
  pour rester visible à côté de lui. Rien de vital à moins de 90 px des bords (Zoom et Meet recadrent).
  Meet montre à Florent son image en miroir : ses interlocuteurs, eux, lisent le texte à l'endroit.

  RENDU (depuis brand/banners/) :
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --disable-gpu --force-device-scale-factor=2 --hide-scrollbars \
      --virtual-time-budget=4000 --window-size=1920,1080 \
      --screenshot="fond-visio-sombre@2x.png" "file://$PWD/fond-visio.html"
  (?ton=clair pour la version claire), puis réduire à 1920 × 1080 et déposer sur Drive 04_IDENTITE-MARQUE/Social.
-->
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'DM Serif Display';src:url('../tools/fonts/DMSerifDisplay-Regular.ttf') format('truetype');font-display:block;}
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=block');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;}
  :root{--fd:#262523;--txt:#F5F0EB;--mut:#D0C5B9;--trait:255,255,255;--terra:#E07855;}
  body.clair{--fd:#FAFAF8;--txt:#3A3A3A;--mut:#6E6E6E;--trait:58,58,58;--terra:#E07855;}
  .cadre{position:relative;width:1920px;height:1080px;background:var(--fd);
    font-family:'DM Sans',-apple-system,Helvetica,Arial,sans-serif;color:var(--txt);}
  svg{position:absolute;inset:0;}
  .marque{position:absolute;top:96px;left:120px;}
  .wordmark{font-family:'DM Serif Display',Georgia,serif;font-size:76px;letter-spacing:-0.01em;line-height:1;}
  .wordmark .dot{color:var(--terra);}
  .lame{width:64px;height:4px;background:var(--terra);margin:26px 0 20px;}
  .site{font-weight:500;font-size:26px;letter-spacing:0.04em;color:var(--mut);}
</style>
</head>
<body>
<div class="cadre">
  <svg viewBox="0 0 1920 1080" id="decor"></svg>
  <div class="marque">
    <div class="wordmark">Latitude<span class="dot">.</span></div>
    <div class="lame"></div>
    <div class="site">latitude.coach</div>
  </div>
</div>
<script>
  const clair = new URLSearchParams(location.search).get('ton') === 'clair';
  if (clair) document.body.classList.add('clair');
  const t = clair ? '58,58,58' : '255,255,255';
  const terra = '#E07855';
  const s = document.getElementById('decor');
  let h = '';
  // quadrillage discret sur tout le cadre
  for (let x = 0; x <= 1920; x += 80) h += `<line x1="${x}" y1="0" x2="${x}" y2="1080" stroke="rgba(${t},${clair?0.045:0.035})" stroke-width="1"/>`;
  for (let y = 0; y <= 1080; y += 80) h += `<line x1="0" y1="${y}" x2="1920" y2="${y}" stroke="rgba(${t},${clair?0.045:0.035})" stroke-width="1"/>`;
  // règle graduée verticale, bord droit
  const rx = 1800;
  h += `<line x1="${rx}" y1="200" x2="${rx}" y2="940" stroke="rgba(${t},0.22)" stroke-width="2"/>`;
  for (let y = 200, i = 0; y <= 940; y += 20, i++) {
    const l = i % 5 === 0 ? 22 : 10;
    h += `<line x1="${rx}" y1="${y}" x2="${rx - l}" y2="${y}" stroke="rgba(${t},${i % 5 === 0 ? 0.32 : 0.18})" stroke-width="2"/>`;
  }
  // règle graduée horizontale, au bas du tiers droit
  const ry = 940;
  h += `<line x1="1340" y1="${ry}" x2="${rx}" y2="${ry}" stroke="rgba(${t},0.22)" stroke-width="2"/>`;
  for (let x = 1340, i = 0; x <= rx; x += 20, i++) {
    const l = i % 5 === 0 ? 22 : 10;
    h += `<line x1="${x}" y1="${ry}" x2="${x}" y2="${ry + l}" stroke="rgba(${t},${i % 5 === 0 ? 0.32 : 0.18})" stroke-width="2"/>`;
  }
  // l'objectif : pointillé terracotta, haut dans la marge droite
  const oy = 300;
  h += `<line x1="1340" y1="${oy}" x2="${rx}" y2="${oy}" stroke="${terra}" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="14 12"/>`;
  // la série qui suit (l'entreprise) : trait neutre
  const suit = 'M1340 900 C 1430 880, 1480 840, 1540 800 S 1640 700, 1700 600 S 1760 470, 1790 400';
  h += `<path d="${suit}" fill="none" stroke="rgba(${t},0.30)" stroke-width="4" stroke-linecap="square"/>`;
  // le réalisé (le dirigeant) : terracotta, qui monte et touche l'objectif
  const real = 'M1340 880 C 1420 850, 1470 790, 1530 730 S 1630 560, 1690 450 S 1750 330, 1780 300';
  h += `<path d="${real}" fill="none" stroke="${terra}" stroke-width="6" stroke-linecap="square"/>`;
  // repère sur l'objectif atteint
  h += `<rect x="1771" y="291" width="18" height="18" fill="${terra}"/>`;
  s.innerHTML = h;
</script>
</body>
</html>
