<!DOCTYPE html>
<html lang="fr">
<!--
  Bannière LinkedIn — profil perso, STYLE PERFORMANCE, registre fin (23/11/2026, à valider par Florent).
  Format : linkedin-perso-banner (1584 × 396).
  Retour de Florent sur la version précédente : « pas assez raffiné, ça fait de gros points, […] pas assez fin
  au niveau des traits, pas assez premium ». D'où : traits fins (1 à 2,5 px), une courbe lisse sans points,
  un seul repère au bout, filets de mesure discrets, pas de barre de progression (c'est un code de la vidéo).
  Référence de registre : les graphiques des rapports financiers haut de gamme (filets, deux séries, légende en
  petites capitales), pas un tableau de bord.
  Variantes par l'adresse : #sombre (défaut), #clair.

  RENDU (depuis brand/banners/) :
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --disable-gpu --force-device-scale-factor=2 --hide-scrollbars \
      --virtual-time-budget=4000 --window-size=1584,396 \
      --screenshot="linkedin-perso-performance.png" "file://$PWD/linkedin-perso-performance.html#sombre"
-->
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'DM Serif Display';src:url('../tools/fonts/DMSerifDisplay-Regular.ttf') format('truetype');font-weight:400;font-display:block;}
  @font-face{font-family:'DM Sans';src:url('../tools/fonts/dm-sans-500.woff') format('woff');font-weight:500;font-display:block;}
  @font-face{font-family:'DM Sans';src:url('../tools/fonts/dm-sans-700.woff') format('woff');font-weight:700;font-display:block;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1584px;height:396px;}
  :root{--fd:#232220;--tr:#F5F0EB;--doux:#C9C1B8;--k:1;--terra:#E07855;}
  body.clair{--fd:#F5F0EB;--tr:#2E2D2B;--doux:#6E6A66;--k:1.6;}
  .b{position:relative;width:1584px;height:396px;overflow:hidden;background:var(--fd);
     font-family:'DM Sans',sans-serif;color:var(--tr);}
  svg.deco{position:absolute;inset:0;}
  .wordmark{position:absolute;top:38px;left:60px;font-family:'DM Serif Display',serif;font-size:38px;letter-spacing:-0.01em;}
  .wordmark .dot{color:var(--terra);}
  .txt{position:absolute;left:380px;top:50%;transform:translateY(-50%);width:760px;}
  .hook{font-family:'DM Serif Display',serif;font-size:50px;line-height:1.12;letter-spacing:-0.01em;}
  .hook .ter{color:var(--terra);}
  .sub{margin-top:18px;font-weight:500;font-size:22px;line-height:1.4;color:var(--doux);letter-spacing:.005em;}
  .cta{margin-top:30px;display:inline-flex;align-items:center;gap:18px;font-weight:700;font-size:21px;
       letter-spacing:.14em;text-transform:uppercase;color:var(--terra);}
  .cta .filet{width:64px;height:2px;background:var(--terra);}
  .cta .fl{color:var(--terra);font-size:22px;letter-spacing:0;}
  .leg{position:absolute;font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;}
</style>
</head>
<body>
<div class="b">
  <svg class="deco" id="deco" viewBox="0 0 1584 396"></svg>
  <div class="wordmark">Latitude<span class="dot">.</span></div>
  <div class="txt">
    <div class="hook">Le vrai levier de votre entreprise,<br><span class="ter">c'est vous.</span></div>
    <div class="sub">Vous prenez de la hauteur, votre entreprise aussi.</div>
    <div class="cta"><span class="filet"></span>Le test du dirigeant, en 5 minutes <span class="fl">&#8595;</span></div>
  </div>
  <div class="leg" id="l1" style="color:var(--terra)">Le dirigeant</div>
  <div class="leg" id="l2" style="color:var(--doux)">L'entreprise</div>
</div>
<script>
const h = location.hash.slice(1) || "sombre";
if (h === "clair") document.body.classList.add("clair");
const cs = getComputedStyle(document.body), TR = cs.getPropertyValue("--tr").trim(), K = parseFloat(cs.getPropertyValue("--k")), FD = cs.getPropertyValue("--fd").trim(), TERRA = "#E07855";
const W = 1584, H = 396, NS = "http://www.w3.org/2000/svg", s = document.getElementById("deco");
const el = (n, a, p = s) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const line = (x1, y1, x2, y2, op, w = 1, dash) => el("line", Object.assign({ x1, y1, x2, y2, stroke: TR, "stroke-opacity": op, "stroke-width": w }, dash ? { "stroke-dasharray": dash } : {}));
const defs = el("defs", {});

// lueur terracotta très douce derrière le graphique
const rg = el("radialGradient", { id: "lu", cx: "86%", cy: "30%", r: "42%" }, defs);
el("stop", { offset: 0, "stop-color": TERRA, "stop-opacity": h === "clair" ? 0.07 : 0.13 }, rg);
el("stop", { offset: 1, "stop-color": TERRA, "stop-opacity": 0 }, rg);
el("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#lu)" });

// zone du graphique
const X0 = 1150, X1 = 1450, Y0 = 336, YT = 74;
// filets horizontaux, très discrets, dans la zone du graphique seulement
for (let y = Y0, i = 0; y >= YT - 10; y -= 44, i++) line(X0 - 30, y, W, y, (i === 0 ? 0.22 : 0.06) * K, 1);
// graduations fines le long de l'axe bas
for (let x = X0 - 30, i = 0; x <= W; x += 14, i++) line(x, Y0, x, Y0 + (i % 5 ? 4 : 9), 0.22 * K, 1);

// deux séries lisses : le dirigeant devant, l'entreprise qui suit (décalée, plus basse)
const N = 9;
const serie = (ret, bas, amp, haut = 1) => Array.from({ length: N }, (_, i) => {
  const u = i / (N - 1), v = Math.max(0, (u - ret) / (1 - ret));
  return [X0 + u * (X1 - X0), Y0 - 18 - bas - (Y0 - YT - 40) * haut * Math.pow(v, 2.1) + Math.sin(i * 2.1) * amp * (1 - v)];
});
const dir = serie(0, 0, 7);
// l'entreprise : même départ, part plus tard, monte moins vite, et s'arrête avant le dirigeant (elle est derrière)
// courbe lisse (Catmull-Rom → Bézier)
const lisse = (p) => { if (p.length > 20) return "M" + p.map(q => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L"); let d = `M${p[0][0]} ${p[0][1]}`; for (let i = 0; i < p.length - 1; i++) {
  const a = p[Math.max(0, i - 1)], b = p[i], c = p[i + 1], e = p[Math.min(p.length - 1, i + 2)], t = 6;
  d += ` C${b[0] + (c[0] - a[0]) / t} ${b[1] + (c[1] - a[1]) / t} ${c[0] - (e[0] - b[0]) / t} ${c[1] - (e[1] - b[1]) / t} ${c[0]} ${c[1]}`; } return d; };
// l'entreprise = la courbe du dirigeant décalée vers la droite (en retard) et vers le bas : toujours derrière et en dessous
const RET = 30, ECART = 12, XE = X1 - 52;
const gabarit = el("path", { d: lisse(dir), fill: "none" }), LG = gabarit.getTotalLength();
const dirDense = Array.from({ length: 120 }, (_, j) => { const P = gabarit.getPointAtLength(LG * j / 119); return [P.x, P.y]; }); gabarit.remove();
const ent = dirDense.map(q => [q[0] + RET, q[1] + ECART]).filter(q => q[0] <= XE);
ent.unshift([X0, dir[0][1] + ECART]);

// aire sous la courbe du dirigeant, en dégradé léger
const ga = el("linearGradient", { id: "aire", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
el("stop", { offset: 0, "stop-color": TERRA, "stop-opacity": h === "clair" ? 0.16 : 0.22 }, ga);
el("stop", { offset: 1, "stop-color": TERRA, "stop-opacity": 0 }, ga);
el("path", { d: lisse(dir) + ` L${X1} ${Y0} L${X0} ${Y0} Z`, fill: "url(#aire)" });

// l'objectif : un prolongement en pointillé fin vers une cible
const fin = dir[N - 1], cible = [X1 + 44, YT - 46];
el("path", { d: `M${fin[0]} ${fin[1]} Q${fin[0] + 24} ${fin[1] - 34} ${cible[0]} ${cible[1]}`, fill: "none", stroke: TERRA, "stroke-opacity": 0.7, "stroke-width": 1.25, "stroke-dasharray": "2 5", "stroke-linecap": "round" });
el("circle", { cx: cible[0], cy: cible[1], r: 7, fill: "none", stroke: TERRA, "stroke-width": 1.25 });
el("circle", { cx: cible[0], cy: cible[1], r: 2, fill: TERRA });

// les deux séries
el("path", { d: lisse(ent), fill: "none", stroke: TR, "stroke-opacity": 0.45 * Math.min(1, K), "stroke-width": 1.5, "stroke-linecap": "round" });
// puis elle rejoint le dirigeant au point final, en pointillé, en arrivant par en dessous (jamais devant lui)
const eF = ent[ent.length - 1], ePrev = ent[ent.length - 4], pente = (eF[1] - ePrev[1]) / (eF[0] - ePrev[0]);
el("path", { d: `M${eF[0]} ${eF[1]} C${eF[0] + 28} ${eF[1] + pente * 28} ${fin[0] - 4} ${fin[1] + 46} ${fin[0]} ${fin[1] + 5}`, fill: "none", stroke: TR, "stroke-opacity": 0.55 * Math.min(1, K), "stroke-width": 1.5, "stroke-dasharray": "2 5", "stroke-linecap": "round" });
el("path", { d: lisse(dir), fill: "none", stroke: TERRA, "stroke-width": 2.5, "stroke-linecap": "round" });

// un seul repère, au bout du réalisé, et sa ligne de lecture
// (ligne de lecture verticale retirée : elle coupait la légende de l'entreprise)
el("circle", { cx: fin[0], cy: fin[1], r: 10, fill: TERRA, "fill-opacity": 0.16 });
el("circle", { cx: fin[0], cy: fin[1], r: 4, fill: FD, stroke: TERRA, "stroke-width": 2 });

// légende en petites capitales, au bout de chaque série
const l1 = document.getElementById("l1"), l2 = document.getElementById("l2"), e2 = ent[ent.length - 1];
l1.style.left = (fin[0] - 128) + "px"; l1.style.top = (fin[1] - 6) + "px";
l2.style.left = (e2[0] + 14) + "px"; l2.style.top = (e2[1] + 10) + "px";
</script>
</body>
</html>
