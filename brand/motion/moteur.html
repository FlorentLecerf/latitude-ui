<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!--
  Moteur des vidéos animées Latitude (motion design par code).
  Aucune animation CSS : tout est calculé par window.image(t), donc chaque image est exacte et rejouable.
  Piloté par rendre.ts : window.demarrer(scenario, format) puis window.image(t) pour chaque image.
  Mode d'emploi, types de scènes et fonds : README.md de ce dossier.
-->
<style>
  @font-face { font-family: "DM Serif Display"; font-weight: 400; src: url("../tools/fonts/DMSerifDisplay-Regular.ttf"); }
  @font-face { font-family: "DM Sans"; font-weight: 500; src: url("../tools/fonts/dm-sans-500.woff"); }
  @font-face { font-family: "DM Sans"; font-weight: 700; src: url("../tools/fonts/dm-sans-700.woff"); }
  @font-face { font-family: "DM Sans"; font-weight: 800; src: url("../tools/fonts/DMSans-ExtraBold.ttf"); }
  :root { --terra: #E07855; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: #000; }
  body { position: relative; font-family: "DM Sans", sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; }
  /* les couches, de bas en haut : le décor, les scènes, la lame et le voile de la chute, la chute, la barre de progression */
  #fond, #voile, #lame { position: absolute; inset: 0; overflow: hidden; }
  #lame { z-index: 2; background: var(--terra); clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }  /* devenue un filet de 2 px au bord du volet (registre fin) */
  #voile { z-index: 2; clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
  .plateau { position: absolute; left: 0; width: 1080px; height: 1350px; }
  #plateau { z-index: 1; }
  #plateau2 { z-index: 3; }
  #hud { position: absolute; left: 96px; width: 888px; z-index: 4; display: flex; gap: 10px; }
  #hud i { flex: 1; height: 2px; background: var(--bord); overflow: hidden; }
  #hud b { display: block; width: 0; height: 100%; background: var(--terra); }
  /* le petit logo, discret, sur toute la vidéo (décision du 18/11/2026), au bout de la barre de progression */
  #logo { position: absolute; right: 96px; z-index: 4; font-family: "DM Serif Display", serif; font-size: 34px; letter-spacing: -0.01em; line-height: 1; color: var(--encre); opacity: .82; white-space: nowrap; }
  #logo i { font-style: normal; color: var(--terra); }
  /* --bas : la place réservée au décor sous les textes (posée par le fond) */
  .scene { position: absolute; inset: 0; opacity: 0; padding: 110px 96px var(--bas, 120px); display: flex; flex-direction: column; justify-content: center; color: var(--encre); transform-origin: 50% 50%; }
  .scene.chute { padding-bottom: 120px; }
  .serif { font-family: "DM Serif Display", serif; font-weight: 400; letter-spacing: -0.012em; }
  /* mot masqué qui monte : le masque garde de la place pour les accents et les jambages */
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .12em 0 .2em; margin: -.12em 0 -.2em; }
  .w > span { display: inline-block; transform: translateY(118%); }
  /* l'accent : terracotta en couleur de texte, jamais d'aplat (registre fin, 23/11/2026) */
  .hot { color: var(--terra); }
  .caps { font-weight: 500; font-size: 24px; letter-spacing: .2em; text-transform: uppercase; }
  .reste { color: transparent; }
  .legende { margin-top: 64px; font-size: 36px; line-height: 1.35; color: var(--doux); opacity: 0; }

  .accroche .filet { width: 0; height: 2px; background: var(--terra); margin-bottom: 40px; }
  .accroche h1 { line-height: 1.07; }
  .accroche .sous { margin-top: 64px; color: var(--terra); opacity: 0; }

  .phrase p { line-height: 1.1; }

  /* bulles et cartes : angles nets, filet fin, pas d'ombre (la carte de référence de DESIGN.md) */
  /* bulles : filet fin, pas d'ombre, pas d'aplat appuyé (registre fin) */
  .bulle .boite { position: relative; margin: 0; padding: 54px 54px 60px; background: var(--carte); border-radius: 12px; border: 1px solid var(--bord-fort); transform-origin: 14% 100%; opacity: 0; }
  .bulle .boite::after { content: ""; position: absolute; left: 70px; bottom: -15px; width: 28px; height: 28px; background: var(--carte); transform: rotate(45deg); border-right: 1px solid var(--bord-fort); border-bottom: 1px solid var(--bord-fort); }
  .bulle .citation { line-height: 1.1; }

  .dialogue .rep { max-width: 790px; padding: 34px 42px 38px; border-radius: 12px; line-height: 1.14; opacity: 0; margin-bottom: 30px; border: 1px solid var(--bord); }
  .dialogue .rep.lui { align-self: flex-start; background: var(--carte); border-color: var(--bord-fort); border-bottom-left-radius: 2px; transform-origin: 0 100%; }
  /* Florent : contour terracotta 1,5 px sur fond terracotta à 10 %, comme le bouton de la bannière */
  .dialogue .rep.moi { align-self: flex-end; background: rgba(224,120,85,.1); color: var(--encre); border: 1.5px solid var(--terra); border-bottom-right-radius: 2px; transform-origin: 100% 100%; }
  .dialogue .legende { margin-top: 34px; }

  .etiquettes h2 { line-height: 1.1; margin-bottom: 54px; }
  /* des rangs séparés par un filet fin, comme les lignes d'un rapport (registre fin) : pas de carte */
  .rang { position: relative; display: flex; align-items: center; gap: 30px; padding: 0 8px 0 4px; border-top: 1px solid var(--bord-fort); font-family: "DM Serif Display", serif; letter-spacing: -0.012em; white-space: nowrap; opacity: 0; }
  .rang:last-of-type { border-bottom: 1px solid var(--bord-fort); }
  .rang b { flex: none; width: 62px; font-family: "DM Sans", sans-serif; font-weight: 500; font-size: 26px; letter-spacing: .16em; color: var(--terra); font-variant-numeric: tabular-nums; }
  .etiquettes .chute { margin-top: 30px; line-height: 1.12; }

  .organigramme h2 { line-height: 1.09; margin-bottom: 34px; }
  .organigramme svg { flex: none; overflow: visible; }
  .organigramme .chute { margin-top: 40px; line-height: 1.12; }

  .chiffre .avant { font-size: 44px; line-height: 1.2; margin-bottom: 18px; }
  .chiffre .grand { line-height: .95; color: var(--terra); letter-spacing: -0.03em; white-space: nowrap; }
  .chiffre .label { line-height: 1.1; margin-top: 26px; }
  .chiffre .contexte { font-size: 36px; color: var(--doux); margin-top: 36px; line-height: 1.35; opacity: 0; }

  /* l'avatar (champ "avatar" d'une scène) : debout à droite, posé sur la bande du décor ; la colonne de texte se resserre */
  .scene.avec-avatar { padding-right: 490px; }
  .scene .avatar { position: absolute; right: 30px; bottom: calc(var(--bas, 120px) - 8px); height: 760px; width: auto; opacity: 0; pointer-events: none; }
  .chute-finale .citation { line-height: 1.07; }
  .chute-finale .trait { width: 0; height: 2px; background: var(--terra); margin-top: 64px; }
  .chute-finale .nom { margin-top: 44px; color: var(--encre); font-weight: 500; font-size: 24px; letter-spacing: .2em; text-transform: uppercase; opacity: 0; }
</style></head>
<body>
<div id="fond"></div>
<div class="plateau" id="plateau"></div>
<div id="lame"></div>
<div id="voile"></div>
<div class="plateau" id="plateau2"></div>
<div id="hud"></div>
<div id="logo">Latitude<i>.</i></div>

<script>
(() => {
const TERRA = "#E07855", W = 1080, PH = 1350, NS = "http://www.w3.org/2000/svg";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {
  lin: (t) => t,
  out: (t) => 1 - Math.pow(1 - t, 3),
  out5: (t) => 1 - Math.pow(1 - t, 5),
  io: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
};
const p = (t, s, d, e = E.out) => e(clamp((t - s) / d));
const el = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; };
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// ---------- texte ----------
// apostrophes courbes, espaces insécables devant ? ! : ; » et après «
const typo = (s) => String(s).replace(/'/g, "’").replace(/[  ]+([?!:;»])/g, " $1").replace(/«[  ]+/g, "« ");
const brut = (s) => typo(s).replace(/\*/g, "");
const nbMots = (s) => brut(s).split(/\s+/).filter(Boolean).length;
// découpe en mots masqués ; *un passage entre étoiles* passe en terracotta
function mots(cible, texte) {
  const out = []; let hot = false;
  typo(texte).split("*").forEach((seg) => {
    seg.split(" ").filter(Boolean).forEach((w) => out.push(`<span class="w${hot ? " c" : ""}"><span${hot ? ' class="hot"' : ""}>${w}</span></span>`));
    hot = !hot;
  });
  cible.innerHTML = out.join(" ");
  return [...cible.querySelectorAll(".w > span")];
}
const monte = (spans, t, s, pas = 0.07, d = 0.75) =>
  spans.forEach((sp, i) => {
    sp.style.transform = `translateY(${(1 - p(t, s + i * pas, d, E.out5)) * 118}%)`;
  });
// un point qui avance le long d'une ligne brisée : u de 0 à 1
const sur = (pts, u) => {
  const seg = []; let L = 0;
  for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(l); L += l; }
  let d = u * L;
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) { const k = seg[i] ? clamp(d / seg[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; }
    d -= seg[i];
  }
};
const finMonte = (spans, s, pas = 0.07, d = 0.75) => s + Math.max(0, spans.length - 1) * pas + d;
const apparait = (e, t, s, d = 0.6, dy = 26) => { const k = p(t, s, d); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * dy}px)`; };
// réduit le corps jusqu'à ce que le bloc tienne dans la hauteur donnée, sans mot qui déborde
function ajuste(e, max, min, hauteur) {
  let s = max; e.style.fontSize = s + "px";
  while (s > min && (e.scrollHeight > hauteur || e.scrollWidth > e.clientWidth + 1)) { s -= 2; e.style.fontSize = s + "px"; }
  return s;
}
// texte tapé : la phrase entière est posée d'avance (invisible), donc la mise en lignes ne bouge jamais
function tape(cible, texte) {
  const T = typo(texte);
  cible.innerHTML = '<span class="tape"></span><span class="reste"></span>';
  const a = cible.firstChild, b = cible.lastChild;
  b.textContent = T;
  return { n: T.length, a, poser(k) { const n = Math.round(clamp(k) * T.length); a.textContent = T.slice(0, n); b.textContent = T.slice(n); return n >= T.length; } };
}

// ---------- bruit ----------
function bruit(seed) {
  let a = seed >>> 0;
  const rnd = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const tab = Array.from({ length: 512 }, rnd);
  const val = (x) => { const i = Math.floor(x), f = x - i, sm = f * f * (3 - 2 * f); const A = tab[((i % 512) + 512) % 512], B = tab[(((i + 1) % 512) + 512) % 512]; return A + (B - A) * sm; };
  return (x, o = 4) => { let amp = 1, fr = 1, sum = 0, n = 0; for (let k = 0; k < o; k++) { sum += amp * val(x * fr); n += amp; amp *= 0.5; fr *= 2.03; } return sum / n; };
}
const toile = (parent, H) => { const s = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H }, parent); s.style.cssText = "position:absolute;left:0;top:0"; return s; };

// ---------- thèmes ----------
const THEMES = {
  clair: { encre: "#3A3A3A", doux: "#6E6E6E", carte: "#FFFFFF", bord: "rgba(58,58,58,.12)", plein: "#3A3A3A", "plein-texte": "#FBF8F4", "bord-fort": "rgba(58,58,58,.3)" },
  sombre: { encre: "#FBF8F4", doux: "#B8B0A8", carte: "#403C3A", bord: "rgba(255,255,255,.14)", plein: "#FBF8F4", "plein-texte": "#2E2E2E", "bord-fort": "rgba(255,255,255,.32)" },
};
const poser = (e, nom) => { for (const k in THEMES[nom]) e.style.setProperty("--" + k, THEMES[nom][k]); };

// ---------- motifs « performance », registre fin (DA du 23/11/2026, DESIGN.md) ----------
// Le registre des graphiques des rapports financiers haut de gamme : traits fins (1 à 1,5 px, 2,5 px au plus pour la
// série terracotta), courbes lisses sans points, un seul repère (anneau fin) au point qui compte, quelques filets très
// légers et une échelle graduée fine en bas. Ni quadrillage plein, ni règle épaisse, ni aplat.
const trait = (svg, x1, y1, x2, y2, stroke, op, w = 1, dash) => svgEl("line", Object.assign({ x1, y1, x2, y2, stroke, "stroke-opacity": op, "stroke-width": w }, dash ? { "stroke-dasharray": dash } : {}), svg);
const pose = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
const brise = (pts) => "M" + pts.map((q) => `${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(" L");
// une courbe lisse passant par les points (Catmull-Rom adoucie, comme la bannière de référence)
const lisse = (q) => { let d = `M${q[0][0].toFixed(1)} ${q[0][1].toFixed(1)}`; for (let i = 0; i < q.length - 1; i++) {
  const a = q[Math.max(0, i - 1)], b = q[i], c = q[i + 1], e = q[Math.min(q.length - 1, i + 2)], t = 6;
  d += ` C${(b[0] + (c[0] - a[0]) / t).toFixed(1)} ${(b[1] + (c[1] - a[1]) / t).toFixed(1)} ${(c[0] - (e[0] - b[0]) / t).toFixed(1)} ${(c[1] - (e[1] - b[1]) / t).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`; } return d; };
const lueur = (f, css) => { el("div", "", f).style.cssText = "position:absolute;inset:0;background:" + css; };
// le socle commun : l'axe, une échelle graduée fine dessous, quelques filets très légers (dans la bande, et dans la marge droite au-dessus)
const socle = (f, H, c) => {
  const s = toile(f, H);
  trait(s, 0, c.sol, W, c.sol, c.tr, 0.24 * c.k);
  for (let x = 8, i = 0; x < W; x += 16, i++) trait(s, x, c.sol, x, c.sol + (i % 5 ? 4 : 10), c.tr, 0.24 * c.k);
  for (let y = c.sol - 48, i = 1; y > c.sol - PH * 0.62; y -= 48, i++) trait(s, y > c.sol - BANDE + 40 ? 0 : W - 150, y, W, y, c.tr, 0.06 * c.k);
  return s;
};
// le repère : un seul, au point qui compte ; un anneau fin et un halo très léger
function repere(s, c) {
  const halo = svgEl("circle", { r: 15, fill: TERRA, "fill-opacity": 0.16 }, s), pointe = svgEl("circle", { r: 6, fill: c.fd, stroke: TERRA, "stroke-width": 2.25 }, s);
  return (x, y) => { pose(pointe, { cx: x, cy: y }); pose(halo, { cx: x, cy: y }); };
}
// l'objectif, visible dès la première image : un anneau fin en pointillé et son centre, là où le décor doit arriver
const objectif = (s, x, y) => { svgEl("circle", { cx: x, cy: y, r: 10, fill: "none", stroke: TERRA, "stroke-width": 1.25, "stroke-dasharray": "2.5 3" }, s); svgEl("circle", { cx: x, cy: y, r: 2.2, fill: TERRA }, s); };
// une légende en petites capitales espacées, collée à sa courbe
const legende = (s, x, y, texte, fill, attrs = {}) => { const t = svgEl("text", Object.assign({ x, y, "font-family": "DM Sans", "font-weight": 500, "font-size": 19, "letter-spacing": 3.8, fill }, attrs), s); t.textContent = texte; return t; };
// les deux tons d'un fond performance : fd = le fond, tr = la couleur des traits, k = dosage des opacités,
// lu = force de la lueur terracotta (très douce : registre fin), doux = la couleur de la série secondaire et de sa légende
const TONS = { sombre: { fd: "#232220", tr: "#F5F0EB", doux: "#C9C1B8", k: 1, lu: 0.15 }, clair: { fd: "#F5F0EB", tr: "#2E2D2B", doux: "#6E6A66", k: 1.6, lu: 0.07 } };
// les poses de l'avatar : "avatar": "perdu" dans une scène prend avatar-perdu.png de ce dossier (ou un chemin absolu)
const AVATARS = "/Users/lecerf/Library/CloudStorage/GoogleDrive-florent@latitude.coach/Mon Drive/03_MARKETING-CONTENU/Photos-Pro/AVATAR";
// hauteur de la bande réservée au décor, sous les textes
const BANDE = 240;

// la courbe de la thèse (gabarit : brand/banners/linkedin-perso-performance.html) : « Le dirigeant » en terracotta
// devant, « L'entreprise » qui le suit, en dessous et en retard ; plate dans la bande, elle décolle dans la marge droite
// et rejoint la cible. reel = un relevé de données : petits mouvements réels, que l'entreprise refait avec un temps de retard.
function courbeThese(f, H, c, reel) {
  lueur(f, `radial-gradient(circle at 96% 46%,rgba(224,120,85,${c.lu}),rgba(224,120,85,0) 50%)`);
  const s = socle(f, H, c), N = reel ? 72 : 48, RET = reel ? 4 : 3, defs = svgEl("defs", {}, s);
  const X = (u) => 28 + u * 1012, hd = (u) => (u <= 0 ? 0 : 170 * Math.pow(u, 1.4) + 440 * Math.pow(u, 20));
  let graine = 7; const alea = () => { graine = (graine * 16807) % 2147483647; return graine / 2147483647 - 0.5; };
  const br = []; let m = 0; for (let i = 0; i < N + RET; i++) { m = m * 0.55 + alea() * 11; br.push(m); }
  const ux = (i) => i / (N - 1), amp = (i) => (reel ? 1 - 0.7 * ux(i) : 0); // le bruit se calme quand la courbe décolle
  const dir = Array.from({ length: N }, (_, i) => [X(ux(i)), c.sol - 18 - hd(ux(i)) + br[i + RET] * amp(i)]);
  const tend = Array.from({ length: N }, (_, i) => [X(ux(i)), c.sol - 8 - 0.72 * hd(ux(i - RET))]);
  const ent = tend.map((q, i) => [q[0], Math.max(q[1] + (reel ? br[Math.max(0, i - RET) + RET] * 0.8 * amp(i) : 0), dir[i][1] + 12)]);
  const fin = dir[N - 1], eF = ent[N - 1], cible = [fin[0] + 12, fin[1] - 64];
  // l'objectif, dès la première image : la trajectoire du dirigeant en pointillé très léger, la cible, et sa ligne jusqu'à l'échelle
  svgEl("path", { d: lisse(dir), fill: "none", stroke: c.tr, "stroke-opacity": 0.2 * c.k, "stroke-width": 1, "stroke-dasharray": "2 6", "stroke-linecap": "round" }, s);
  svgEl("path", { d: `M${fin[0]} ${fin[1]} Q${fin[0] + 4} ${fin[1] - 34} ${cible[0]} ${cible[1]}`, fill: "none", stroke: TERRA, "stroke-opacity": 0.7, "stroke-width": 1.25, "stroke-dasharray": "2 5", "stroke-linecap": "round" }, s);
  trait(s, cible[0], cible[1] + 12, cible[0], c.sol, c.tr, 0.3 * c.k, 1, "3 5");
  objectif(s, cible[0], cible[1]);
  // le réalisé, découvert de gauche à droite
  const ga = svgEl("linearGradient", { id: "aire", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  svgEl("stop", { offset: 0, "stop-color": TERRA, "stop-opacity": c.k > 1 ? 0.16 : 0.22 }, ga); svgEl("stop", { offset: 1, "stop-color": TERRA, "stop-opacity": 0 }, ga);
  const masque = svgEl("rect", { x: 0, y: 0, width: 0, height: H }, svgEl("clipPath", { id: "avance" }, defs));
  const g = svgEl("g", { "clip-path": "url(#avance)" }, s);
  svgEl("path", { d: lisse(dir) + ` L${fin[0]} ${c.sol} L${dir[0][0]} ${c.sol} Z`, fill: "url(#aire)" }, g);
  svgEl("path", { d: lisse(ent), fill: "none", stroke: c.tr, "stroke-opacity": 0.45 * Math.min(1, c.k), "stroke-width": 1.5, "stroke-linecap": "round" }, g);
  svgEl("path", { d: lisse(dir), fill: "none", stroke: TERRA, "stroke-width": 2.5, "stroke-linecap": "round" }, g);
  // les légendes, collées à leur courbe : le dirigeant au-dessus de la sienne, l'entreprise écrite le long de la sienne, dessous
  // (les deux écrites le long de la tendance de leur courbe, sans ses petits mouvements, sinon les lettres se chevauchent)
  const leLong = (id, pts, texte, fill, dy, depart) => {
    svgEl("path", { id, d: brise(pts), fill: "none" }, defs);
    const te = legende(g, 0, 0, "", fill, { dy }); te.removeAttribute("x"); te.removeAttribute("y");
    svgEl("textPath", { href: "#" + id, startOffset: depart }, te).textContent = texte;
  };
  leLong("pd", dir.map((q, i) => [q[0], c.sol - 18 - hd(ux(i))]), "LE DIRIGEANT", TERRA, -16, "24%");
  leLong("pe", tend, "L'ENTREPRISE", c.doux, 30, "46%");
  // à la fin, l'entreprise rejoint elle aussi la cible, par en dessous et après le dirigeant
  const jonction = svgEl("path", { d: `M${eF[0]} ${eF[1]} Q${eF[0] + 18} ${eF[1] - 120} ${cible[0]} ${cible[1] + 12}`, fill: "none", stroke: c.tr, "stroke-opacity": 0.55 * Math.min(1, c.k), "stroke-width": 1.25, "stroke-dasharray": "2 5", "stroke-linecap": "round", opacity: 0 }, s);
  const lecture = svgEl("line", { stroke: c.tr, "stroke-opacity": 0.3 * c.k, "stroke-width": 1, "stroke-dasharray": "2 4" }, s), ici = repere(s, c);

// ---------- scènes : chacune construit son contenu et rend { d (durée), jouer(t) } ----------
// LE RYTHME : le seul endroit où ralentir ou accélérer toutes les vidéos.
//   mots, legende : vitesse de lecture comptée, en mots par seconde (plus bas = plus lent)
//   pause : temps ajouté à la fin de chaque scène, une fois tout affiché
//   Réglé le 17/11/2026 sur le retour de Florent (« ça va un tout petit peu vite, mais pas de beaucoup ») :
//   4.6 → 4.2, 5.2 → 4.6, pause 0 → 0.3. Un cran à la fois : 0.2 mot par seconde, 0.1 s de pause.

  accroche(sc, s) {
    el("div", "filet", s);
    const h1 = el("h1", "serif", s);

    const sous = sc.sous ? el("p", "caps sous", s) : null; if (sous) sous.textContent = typo(sc.sous);
    let t0 = 0.3; const dep = lignes.map((sp) => { const a = t0; t0 += sp.length * 0.085 + 0.35; return a; });
    const tSous = t0 + 0.2, n = nbMots([].concat(sc.lignes).join(" ")) + (sc.sous ? nbMots(sc.sous) : 0);

      s.querySelector(".filet").style.width = p(t, 0.15, 0.6) * 132 + "px";

  },

  etiquettes(sc, s) {

  // un grand chiffre qui compte, son libellé, un contexte facultatif

// ---------- montage ----------
let ETAT = null;
window.demarrer = async (sc, format = "4x5") => {
  const H = format === "9x16" ? 1920 : PH;
  for (const e of [document.documentElement, document.body]) { e.style.width = W + "px"; e.style.height = H + "px"; }
  await Promise.all(['400 10px "DM Serif Display"', '500 10px "DM Sans"', '700 10px "DM Sans"', '800 10px "DM Sans"'].map((f) => document.fonts.load(f)));
  const fond = FONDS[sc.fond || "courbe"]; if (!fond) throw new Error(`fond inconnu : « ${sc.fond} » (fonds : ${Object.keys(FONDS).join(", ")})`);
  // un fond performance existe en deux tons : le sien, ou celui que le scénario demande ("ton")
  const ton = fond.tons && (sc.ton === "clair" || sc.ton === "sombre") ? sc.ton : fond.theme, inverse = ton === "clair" ? "sombre" : "clair";
  poser(document.body, ton); document.body.style.setProperty("--bas", (fond.bas || 120) + "px");
  const decor = document.getElementById("fond"), c = { ...TONS[ton], sol: (H + PH) / 2 - 46 };
  if (fond.tons) decor.style.background = c.fd;

  const voile = document.getElementById("voile"); voile.style.background = TONS[inverse].fd;
  const haut = (H - PH) / 2, p1 = document.getElementById("plateau"), p2 = document.getElementById("plateau2");
  p1.style.top = p2.style.top = haut + "px";
  const types = { ...SCENES, ...(window.SCENES_SUR_MESURE || {}) }, ctx = { theme: ton, inverse, signature: sc.signature, format, H };
  if (!Array.isArray(sc.scenes) || !sc.scenes.length) throw new Error("le scénario n'a aucune scène");

  const scenes = sc.scenes.map((def, i) => {
    const faire = types[def.type]; if (!faire) throw new Error(`scène ${i + 1} : type inconnu « ${def.type} » (types : ${Object.keys(types).join(", ")})`);
    const s = el("section", "scene " + def.type, def.type === "chute" ? p2 : p1);
    // l'avatar, facultatif : la colonne se resserre avant que la scène mesure ses textes
    let av = null;
    if (def.avatar) {
      if (def.type === "chute") throw new Error(`scène ${i + 1} : pas d'avatar sur la chute (la dernière image reste la phrase et le nom)`);
      s.classList.add("avec-avatar");

  const avecLogo = sc.logo !== false; logo.style.display = avecLogo ? "" : "none"; logo.style.top = haut + 56 - 26 + "px"; hud.style.width = (avecLogo ? 888 - 196 : 888) + "px";
  scenes.forEach((x) => { x.jauge = el("b", "", el("i", "", hud)); });

  ETAT = { scenes, vivre, voile, hud, logo, lame: document.getElementById("lame"), theme: ton, inverse, duree: a, cap: scenes.length > 1 && fin.voile ? fin.a : a };
  window.image(0);
  return { duree: a, scenes: scenes.map((x) => ({ type: x.type, debut: +x.a.toFixed(2), duree: +x.d.toFixed(2) })), reperes: scenes.flatMap((x) => [x.a + x.d * 0.5, x.a + x.d - 0.45]) };
};
window.image = (T) => {
  const { scenes, vivre, voile, hud, logo, lame, theme, inverse, cap } = ETAT;
  vivre(T, cap);
  let q = 0;
  scenes.forEach((x, i) => {
