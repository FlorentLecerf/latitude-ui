<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!--
  Moteur des vidéos animées Latitude (motion design par code).
  Aucune animation CSS : tout est calculé par window.image(t), donc chaque image est exacte et rejouable.
  Piloté par rendre.ts : window.demarrer(scenario, format) puis window.image(t) pour chaque image.
  Mode d'emploi, types de scènes et fonds : README.md de ce dossier.
-->
<style>
  @font-face { font-family: "DM Serif Display"; font-weight: 400; src: url("../tools/fonts/DMSerifDisplay-Regular.ttf"); }
  @font-face { font-family: "DM Sans"; font-weight: 500; src: url("../tools/fonts/dm-sans-500.woff"); }
  @font-face { font-family: "DM Sans"; font-weight: 700; src: url("../tools/fonts/dm-sans-700.woff"); }
  @font-face { font-family: "DM Sans"; font-weight: 800; src: url("../tools/fonts/DMSans-ExtraBold.ttf"); }
  :root { --terra: #E07855; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: #000; }
  body { position: relative; font-family: "DM Sans", sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; }
  /* les couches, de bas en haut : le décor, les scènes, la lame et le voile de la chute, la chute, la barre de progression */
  #fond, #voile, #lame { position: absolute; inset: 0; overflow: hidden; }
  #lame { z-index: 2; background: var(--terra); clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
  #voile { z-index: 2; clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
  .plateau { position: absolute; left: 0; width: 1080px; height: 1350px; }
  #plateau { z-index: 1; }
  #plateau2 { z-index: 3; }
  #hud { position: absolute; left: 96px; width: 888px; z-index: 4; display: flex; gap: 8px; }
  #hud i { flex: 1; height: 6px; background: var(--bord); overflow: hidden; }
  #hud b { display: block; width: 0; height: 100%; background: var(--terra); }
  /* le petit logo, discret, sur toute la vidéo (décision du 18/11/2026), au bout de la barre de progression */
  #logo { position: absolute; right: 96px; z-index: 4; font-family: "DM Serif Display", serif; font-size: 34px; letter-spacing: -0.01em; line-height: 1; color: var(--encre); opacity: .82; white-space: nowrap; }
  #logo i { font-style: normal; color: var(--terra); }
  /* --bas : la place réservée au décor sous les textes (posée par le fond) */
  .scene { position: absolute; inset: 0; opacity: 0; padding: 110px 96px var(--bas, 120px); display: flex; flex-direction: column; justify-content: center; color: var(--encre); transform-origin: 50% 50%; }
  .scene.chute { padding-bottom: 120px; }
  .serif { font-family: "DM Serif Display", serif; font-weight: 400; letter-spacing: -0.012em; }
  /* mot masqué qui monte : le masque garde de la place pour les accents et les jambages */
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .12em 0 .2em; margin: -.12em 0 -.2em; }
  .w > span { display: inline-block; transform: translateY(118%); }
  /* l'accent : terracotta, puis un aplat qui balaie le mot (le masque s'élargit pour que les aplats se touchent) */
  .hot { color: var(--terra); }
  .w.c { margin-left: -.13em; margin-right: -.13em; }
  .w.c > span { padding: 0 .13em; background: linear-gradient(var(--terra), var(--terra)) no-repeat 0 50% / 0% 100%; }
  .caps { font-weight: 800; font-size: 26px; letter-spacing: .16em; text-transform: uppercase; }
  .reste { color: transparent; }
  .legende { margin-top: 64px; font-size: 36px; line-height: 1.35; color: var(--doux); opacity: 0; }

  .accroche .filet { width: 0; height: 12px; background: var(--terra); margin-bottom: 34px; }
  .accroche h1 { line-height: 1.07; }
  .accroche .sous { margin-top: 64px; color: var(--terra); opacity: 0; }

  .phrase p { line-height: 1.1; }

  /* bulles et cartes : angles nets, filet fin, pas d'ombre (la carte de référence de DESIGN.md) */
  .bulle .boite { position: relative; margin: 0; padding: 54px 54px 60px; background: var(--carte); border-radius: 12px; border: 2px solid var(--bord-fort); transform-origin: 14% 100%; opacity: 0; }
  .bulle .boite::after { content: ""; position: absolute; left: 70px; bottom: -22px; width: 40px; height: 40px; background: var(--carte); transform: rotate(45deg); border-radius: 0 0 4px 0; border-right: 2px solid var(--bord-fort); border-bottom: 2px solid var(--bord-fort); }
  .bulle .citation { line-height: 1.1; }

  .dialogue .rep { max-width: 790px; padding: 34px 42px 38px; border-radius: 12px; line-height: 1.14; opacity: 0; margin-bottom: 30px; border: 2px solid var(--bord); }
  .dialogue .rep.lui { align-self: flex-start; background: var(--carte); border-color: var(--bord-fort); border-bottom-left-radius: 2px; transform-origin: 0 100%; }
  .dialogue .rep.moi { align-self: flex-end; background: var(--terra); color: #FFFFFF; border-color: transparent; border-bottom-right-radius: 2px; transform-origin: 100% 100%; }
  .dialogue .legende { margin-top: 34px; }

  .etiquettes h2 { line-height: 1.1; margin-bottom: 54px; }
  .rang { display: flex; align-items: center; gap: 30px; padding: 0 40px 0 36px; border-radius: 10px; background: var(--carte); border: 1.5px solid var(--bord); font-family: "DM Serif Display", serif; letter-spacing: -0.012em; white-space: nowrap; opacity: 0; }
  .rang b { flex: none; width: 62px; font-family: "DM Sans", sans-serif; font-weight: 800; font-size: 35px; letter-spacing: .04em; color: var(--terra); font-variant-numeric: tabular-nums; }
  .etiquettes .chute { margin-top: 30px; line-height: 1.12; }

  .organigramme h2 { line-height: 1.09; margin-bottom: 34px; }
  .organigramme svg { flex: none; overflow: visible; }
  .organigramme .chute { margin-top: 40px; line-height: 1.12; }

  .chiffre .avant { font-size: 44px; line-height: 1.2; margin-bottom: 18px; }
  .chiffre .grand { line-height: .95; color: var(--terra); letter-spacing: -0.03em; white-space: nowrap; }
  .chiffre .label { line-height: 1.1; margin-top: 26px; }
  .chiffre .contexte { font-size: 36px; color: var(--doux); margin-top: 36px; line-height: 1.35; opacity: 0; }

  /* l'avatar (champ "avatar" d'une scène) : debout à droite, posé sur la bande du décor ; la colonne de texte se resserre */
  .scene.avec-avatar { padding-right: 490px; }
  .scene .avatar { position: absolute; right: 30px; bottom: calc(var(--bas, 120px) - 8px); height: 760px; width: auto; opacity: 0; pointer-events: none; }
  .chute-finale .citation { line-height: 1.07; }
  .chute-finale .trait { width: 0; height: 8px; background: var(--terra); margin-top: 64px; }
  .chute-finale .nom { margin-top: 44px; color: var(--encre); font-weight: 800; font-size: 26px; letter-spacing: .18em; text-transform: uppercase; opacity: 0; }
</style></head>
<body>
<div id="fond"></div>
<div class="plateau" id="plateau"></div>
<div id="lame"></div>
<div id="voile"></div>
<div class="plateau" id="plateau2"></div>
<div id="hud"></div>
<div id="logo">Latitude<i>.</i></div>

<script>
(() => {
const TERRA = "#E07855", W = 1080, PH = 1350, NS = "http://www.w3.org/2000/svg";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {
  lin: (t) => t,
  out: (t) => 1 - Math.pow(1 - t, 3),
  out5: (t) => 1 - Math.pow(1 - t, 5),
  io: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
};
const p = (t, s, d, e = E.out) => e(clamp((t - s) / d));
const el = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; };
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// ---------- texte ----------
// apostrophes courbes, espaces insécables devant ? ! : ; » et après «
const typo = (s) => String(s).replace(/'/g, "’").replace(/[  ]+([?!:;»])/g, " $1").replace(/«[  ]+/g, "« ");
const brut = (s) => typo(s).replace(/\*/g, "");
const nbMots = (s) => brut(s).split(/\s+/).filter(Boolean).length;
// découpe en mots masqués ; *un passage entre étoiles* passe en terracotta
function mots(cible, texte) {
  const out = []; let hot = false;
  typo(texte).split("*").forEach((seg) => {
    seg.split(" ").filter(Boolean).forEach((w) => out.push(`<span class="w${hot ? " c" : ""}"><span${hot ? ' class="hot"' : ""}>${w}</span></span>`));
    hot = !hot;
  });
  cible.innerHTML = out.join(" ");
  return [...cible.querySelectorAll(".w > span")];
}
const monte = (spans, t, s, pas = 0.07, d = 0.75) =>
  spans.forEach((sp, i) => {
    sp.style.transform = `translateY(${(1 - p(t, s + i * pas, d, E.out5)) * 118}%)`;
    // une fois le mot monté, l'aplat le balaie de gauche à droite et le mot passe en blanc
    if (sp.className === "hot") { const k = p(t, s + i * pas + d * 0.62, 0.3, E.io); sp.style.backgroundSize = `${(k * 100).toFixed(1)}% 100%`; sp.style.color = k > 0.5 ? "#FFFFFF" : ""; }
  });
// un point qui avance le long d'une ligne brisée : u de 0 à 1
const sur = (pts, u) => {
  const seg = []; let L = 0;
  for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(l); L += l; }
  let d = u * L;
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) { const k = seg[i] ? clamp(d / seg[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; }
    d -= seg[i];
  }
};
const finMonte = (spans, s, pas = 0.07, d = 0.75) => s + Math.max(0, spans.length - 1) * pas + d;
const apparait = (e, t, s, d = 0.6, dy = 26) => { const k = p(t, s, d); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * dy}px)`; };
// réduit le corps jusqu'à ce que le bloc tienne dans la hauteur donnée, sans mot qui déborde
function ajuste(e, max, min, hauteur) {
  let s = max; e.style.fontSize = s + "px";
  while (s > min && (e.scrollHeight > hauteur || e.scrollWidth > e.clientWidth + 1)) { s -= 2; e.style.fontSize = s + "px"; }
  return s;
}
// texte tapé : la phrase entière est posée d'avance (invisible), donc la mise en lignes ne bouge jamais
function tape(cible, texte) {
  const T = typo(texte);
  cible.innerHTML = '<span class="tape"></span><span class="reste"></span>';
  const a = cible.firstChild, b = cible.lastChild;
  b.textContent = T;
  return { n: T.length, a, poser(k) { const n = Math.round(clamp(k) * T.length); a.textContent = T.slice(0, n); b.textContent = T.slice(n); return n >= T.length; } };
}

// ---------- bruit ----------
function bruit(seed) {
  let a = seed >>> 0;
  const rnd = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const tab = Array.from({ length: 512 }, rnd);
  const val = (x) => { const i = Math.floor(x), f = x - i, sm = f * f * (3 - 2 * f); const A = tab[((i % 512) + 512) % 512], B = tab[(((i + 1) % 512) + 512) % 512]; return A + (B - A) * sm; };
  return (x, o = 4) => { let amp = 1, fr = 1, sum = 0, n = 0; for (let k = 0; k < o; k++) { sum += amp * val(x * fr); n += amp; amp *= 0.5; fr *= 2.03; } return sum / n; };
}
const toile = (parent, H) => { const s = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H }, parent); s.style.cssText = "position:absolute;left:0;top:0"; return s; };

// ---------- thèmes ----------
const THEMES = {
  clair: { encre: "#3A3A3A", doux: "#6E6E6E", carte: "#FFFFFF", bord: "rgba(58,58,58,.12)", plein: "#3A3A3A", "plein-texte": "#FBF8F4", "bord-fort": "rgba(58,58,58,.3)" },
  sombre: { encre: "#FBF8F4", doux: "#B8B0A8", carte: "#403C3A", bord: "rgba(255,255,255,.14)", plein: "#FBF8F4", "plein-texte": "#2E2E2E", "bord-fort": "rgba(255,255,255,.32)" },
};
const poser = (e, nom) => { for (const k in THEMES[nom]) e.style.setProperty("--" + k, THEMES[nom][k]); };

// ---------- motifs « performance » : la mesure, et ce qui monte ----------
const trait = (svg, x1, y1, x2, y2, stroke, op, w = 1) => svgEl("line", { x1, y1, x2, y2, stroke, "stroke-opacity": op, "stroke-width": w }, svg);
const pose = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
const brise = (pts) => "M" + pts.map((q) => `${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(" L");
// quadrillage fin, un trait sur quatre plus marqué
function grille(svg, H, pas, stroke, op) {
  for (let x = pas, i = 1; x < W; x += pas, i++) trait(svg, x, 0, x, H, stroke, i % 4 === 0 ? op * 1.9 : op);
  for (let y = H - pas, i = 1; y > 0; y -= pas, i++) trait(svg, 0, y, W, y, stroke, i % 4 === 0 ? op * 1.9 : op);
}
// graduations de règle le long du bord gauche et du bord bas
function regle(svg, H, stroke, op) {
  for (let y = H - 36, i = 0; y > 20; y -= 18, i++) trait(svg, 0, y, i % 5 === 0 ? 30 : 15, y, stroke, op, 2);
  for (let x = 36, i = 0; x < W - 10; x += 18, i++) trait(svg, x, H, x, H - (i % 5 === 0 ? 30 : 15), stroke, op, 2);
}
const lueur = (f, css) => { el("div", "", f).style.cssText = "position:absolute;inset:0;background:" + css; };
// le socle commun : quadrillage et règles graduées
const socle = (f, H, c) => { const s = toile(f, H); grille(s, H, 54, c.tr, 0.04 * c.k); regle(s, H, c.tr, 0.42 * c.k); return s; };
// le repère qui avance : un anneau terracotta et son halo qui bat
function repere(s, c) {
  const halo = svgEl("circle", { r: 32, fill: TERRA, opacity: 0.24 }, s), pointe = svgEl("circle", { r: 12, fill: c.fd, stroke: TERRA, "stroke-width": 7 }, s);
  return (x, y, T) => { pose(pointe, { cx: x, cy: y }); pose(halo, { cx: x, cy: y, r: 30 + 8 * Math.sin(T * 3) }); };
}
// l'objectif, visible dès la première image : un anneau en pointillé là où le décor doit arriver
const objectif = (s, x, y) => svgEl("circle", { cx: x, cy: y, r: 24, fill: "none", stroke: TERRA, "stroke-width": 3, "stroke-dasharray": "5 6" }, s);
// les deux tons d'un fond performance : fd = le fond, tr = la couleur des traits, k = dosage des opacités,
// lu = force de la lueur terracotta (franche sur sombre, à peine posée sur clair : sinon le crème vire au pêche), carte = fond d'une tuile
const TONS = { sombre: { fd: "#262523", tr: "#FBF8F4", k: 1, lu: 0.3, carte: "#3B3835" }, clair: { fd: "#F5F0EB", tr: "#3A3A3A", k: 1.25, lu: 0.1, carte: "#FFFFFF" } };
// les poses de l'avatar : "avatar": "perdu" dans une scène prend avatar-perdu.png de ce dossier (ou un chemin absolu)
const AVATARS = "/Users/lecerf/Library/CloudStorage/GoogleDrive-florent@latitude.coach/Mon Drive/03_MARKETING-CONTENU/Photos-Pro/AVATAR";
// hauteur de la bande réservée au décor, sous les textes
const BANDE = 240;

// ---------- fonds : chacun pose son décor et rend la fonction qui le fait vivre ----------
// monter(f, H, sc, c) : c = { fd, tr, k, lu, carte, sol } (ton du fond et ligne de base de la bande, fonds performance seulement)
// vivre(T, D) : T = temps de la vidéo, D = moment où la chute arrive (le décor a fini de monter à ce moment-là)
const FONDS = {
  // ===== style « performance » (17/11/2026) : des décors qui mesurent et qui montent =====
  // Le décor vit dans une bande au bas du cadre, sous les textes (bas: BANDE), et monte dans la marge droite :
  // il ne passe jamais derrière une phrase. L'objectif est tracé en pointillé dès la première image, le réalisé
  // le rattrape pendant la vidéo. Chaque fond existe en deux tons : le sien, et l'autre avec "ton" dans le scénario.

  // la courbe : deux séries qui grimpent, le dirigeant (terracotta) devant, l'entreprise qui le suit ; elle décolle à droite
  courbe: { theme: "sombre", tons: true, bas: BANDE, monter(f, H, sc, c) {
    const G = 14, N = 27;
    lueur(f, `radial-gradient(circle at 100% 46%,rgba(224,120,85,${c.lu}),rgba(224,120,85,0) 54%)`);
    const s = socle(f, H, c), X = (i) => -G + (i / (N - 1)) * (W + 2 * G);
    const serie = (b, retard, bas, amp) => Array.from({ length: N }, (_, i) => {
      const u = Math.max(0, i / (N - 1) - retard);
      return [X(i), c.sol + bas - PH * (0.06 * u + 0.5 * Math.pow(u, 5.5)) - (b(i * 0.9, 3) - 0.5) * PH * amp * (0.45 + u)];
    });
    const dir = serie(bruit(31), 0, 0, 0.05), ent = serie(bruit(77), 0.07, 30, 0.035);
    ent.forEach((q, i) => { q[1] = Math.max(q[1], dir[i][1] + 24); });
    const yEn = (x) => { const u = clamp((x + G) / (W + 2 * G)) * (N - 1), i = Math.min(N - 2, Math.floor(u)); return dir[i][1] + (dir[i + 1][1] - dir[i][1]) * (u - i); };
    const xFin = -G + 0.96 * (W + 2 * G);
    svgEl("path", { d: brise(dir), fill: "none", stroke: c.tr, "stroke-opacity": 0.36 * c.k, "stroke-width": 2.5, "stroke-dasharray": "2 10", "stroke-linecap": "round" }, s);
    objectif(s, xFin, yEn(xFin));
    const defs = svgEl("defs", {}, s), grad = svgEl("linearGradient", { id: "aire", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    svgEl("stop", { offset: 0, "stop-color": TERRA, "stop-opacity": 0.44 }, grad); svgEl("stop", { offset: 1, "stop-color": TERRA, "stop-opacity": 0 }, grad);
    const masque = svgEl("rect", { x: 0, y: 0, width: 0, height: H }, svgEl("clipPath", { id: "avance" }, defs));
    const g = svgEl("g", { "clip-path": "url(#avance)" }, s);
    svgEl("path", { d: brise(dir) + ` L${W + G} ${H} L${-G} ${H} Z`, fill: "url(#aire)" }, g);
    svgEl("path", { d: brise(ent), fill: "none", stroke: c.tr, "stroke-opacity": 0.6, "stroke-width": 3.5, "stroke-linejoin": "round" }, g);
    svgEl("path", { d: brise(dir), fill: "none", stroke: TERRA, "stroke-width": 6.5, "stroke-linejoin": "round" }, g);
    dir.forEach((q) => svgEl("circle", { cx: q[0], cy: q[1], r: 6.5, fill: c.fd, stroke: TERRA, "stroke-width": 3.5 }, g));
    const visee = svgEl("line", { stroke: c.tr, "stroke-opacity": 0.4, "stroke-width": 1.5, "stroke-dasharray": "5 8" }, s), ici = repere(s, c);
    return (T, D) => {
      const x = -G + (0.12 + 0.84 * clamp(T / D)) * (W + 2 * G), y = yEn(x);
      masque.setAttribute("width", Math.max(0, x)); ici(x, y, T);
      pose(visee, { x1: x, y1: y + 26, x2: x, y2: H });
    };
  } },
  // les barres : un histogramme qui se remplit de gauche à droite ; la dernière barre, terracotta, monte bien plus haut que les autres
  barres: { theme: "clair", tons: true, bas: BANDE, monter(f, H, sc, c) {
    lueur(f, `radial-gradient(circle at 100% 44%,rgba(224,120,85,${c.lu}),rgba(224,120,85,0) 52%)`);
    const s = socle(f, H, c), n = 15, pas = (W - 60) / n, l = pas * 0.64, b = bruit(5);
    const barres = Array.from({ length: n }, (_, i) => {
      const u = i / (n - 1), fin = i === n - 1, h = fin ? PH * 0.46 : (34 + 140 * Math.pow(u, 1.5)) * (0.84 + 0.3 * b(i * 1.7, 2)), x = 30 + i * pas + (pas - l) / 2;
      svgEl("rect", { x, y: c.sol - h, width: l, height: h, fill: "none", stroke: fin ? TERRA : c.tr, "stroke-opacity": fin ? 1 : 0.34 * c.k, "stroke-width": fin ? 3 : 1.5, "stroke-dasharray": fin ? "6 7" : "none" }, s);
      return { e: svgEl("rect", { x, y: c.sol, width: l, height: 0, fill: fin ? TERRA : c.tr, opacity: fin ? 1 : (0.2 + 0.24 * u) * c.k }, s), h, u };
    });
    trait(s, 0, c.sol, W, c.sol, c.tr, 0.6 * c.k, 2.5);
    return (T, D) => barres.forEach((q) => { const k = p(T, 0.1 + (q.u - 0.14) * D * 0.98, 0.9, E.out5); pose(q.e, { y: c.sol - q.h * k, height: q.h * k }); });
  } },
  // le cap : l'arc d'un grand cadran gradué qui tourne ; l'aiguille terracotta cherche, puis tient sa direction dans la zone visée
  cap: { theme: "sombre", tons: true, bas: BANDE, monter(f, H, sc, c) {
    const cx = W / 2, cy = c.sol + 376, R = 560, CAP = 12, rad = (a) => ((a - 90) * Math.PI) / 180;
    lueur(f, `radial-gradient(circle at ${cx}px ${cy - R * 0.6}px,rgba(224,120,85,${c.lu}),rgba(224,120,85,0) 42%)`);

      liens.forEach((l) => { l.e.style.strokeDashoffset = l.len * (1 - p(t, l.a, 0.5, E.io)); l.e.style.opacity = t > l.a ? 1 : 0; });
      services.forEach((nd, i) => pop(nd, 1.95 + Math.abs(i - mid) * 0.14));
      if (chute) monte(chute, t, 2.75, 0.05);
      points.forEach((pt) => { const [x, y] = sur(pt.pts, p(t, pt.a, 1.5, E.io)); pt.e.setAttribute("cx", x); pt.e.setAttribute("cy", y); pt.e.setAttribute("opacity", t >= pt.a ? 1 : 0); });
    } };
  },
  // un grand chiffre qui compte, son libellé, un contexte facultatif
  chiffre(sc, s) {
    const avant = sc.avant ? el("p", "avant serif", s) : null; if (avant) avant.textContent = typo(sc.avant);
    const grand = el("div", "grand serif", s), lab = el("p", "label serif", s), labM = mots(lab, sc.label);
    const m = String(sc.valeur).match(/^(\D*)(\d+)(.*)$/), cible = m ? parseInt(m[2], 10) : null;
    grand.textContent = String(sc.valeur); ajuste(grand, 320, 140, 400); ajuste(lab, 64, 42, 240);
    const ctx = sc.contexte ? el("p", "contexte", s) : null; if (ctx) ctx.textContent = typo(sc.contexte);
    const n = nbMots(sc.label) + (sc.contexte ? nbMots(sc.contexte) : 0);
    return { d: Math.max(3.4, 1.3 + lecture(n) + 0.5), jouer(t) {
      if (avant) apparait(avant, t, 0.1);
      grand.style.opacity = p(t, 0.25, 0.3);
      grand.style.transform = `translateY(${(1 - p(t, 0.25, 0.7)) * 40}px)`;
      grand.textContent = m ? m[1] + Math.round(cible * p(t, 0.3, 1.2, E.out)) + m[3] : String(sc.valeur);
      monte(labM, t, 1.15, 0.06);
      if (ctx) apparait(ctx, t, 1.9);
    } };
  },
  // la dernière image : le décor s'inverse, la phrase qui reste (signature seulement si la chute en porte une)
  chute(sc, s, ctx) {
    s.classList.add("chute-finale"); poser(s, ctx.inverse);
    const cit = el("p", "citation serif", s), sp = mots(cit, sc.texte); ajuste(cit, 104, 56, 620);
    const trait = el("div", "trait", s);
    // plus de signature par défaut (décision du 18/11/2026 : le nom de Florent est déjà l'auteur de la publication) ; seulement si la chute en porte une
    const sig = typeof sc.signature === "string" ? sc.signature : null;
    const nom = sig ? el("p", "nom", s) : null; if (nom) nom.textContent = sig;
    const fin = finMonte(sp, 0.55, 0.1, 0.85), tTrait = fin - 0.05, tNom = tTrait + 0.35;
    return { voile: true, d: Math.max(tNom + 2.4, 0.55 + sp.length / 3 + 1.5), jouer(t) {
      monte(sp, t, 0.55, 0.1, 0.85);
      trait.style.width = p(t, tTrait, 0.7) * 120 + "px";
      if (nom) apparait(nom, t, tNom);
    } };
  },
};

// ---------- montage ----------
let ETAT = null;
window.demarrer = async (sc, format = "4x5") => {
  const H = format === "9x16" ? 1920 : PH;
  for (const e of [document.documentElement, document.body]) { e.style.width = W + "px"; e.style.height = H + "px"; }
  await Promise.all(['400 10px "DM Serif Display"', '500 10px "DM Sans"', '700 10px "DM Sans"', '800 10px "DM Sans"'].map((f) => document.fonts.load(f)));
  const fond = FONDS[sc.fond || "courbe"]; if (!fond) throw new Error(`fond inconnu : « ${sc.fond} » (fonds : ${Object.keys(FONDS).join(", ")})`);
  // un fond performance existe en deux tons : le sien, ou celui que le scénario demande ("ton")
  const ton = fond.tons && (sc.ton === "clair" || sc.ton === "sombre") ? sc.ton : fond.theme, inverse = ton === "clair" ? "sombre" : "clair";
  poser(document.body, ton); document.body.style.setProperty("--bas", (fond.bas || 120) + "px");
  const decor = document.getElementById("fond"), c = { ...TONS[ton], sol: (H + PH) / 2 - 46 };
  if (fond.tons) decor.style.background = c.fd;
  const vivre = fond.monter(decor, H, sc, c);
  const voile = document.getElementById("voile"); voile.style.background = TONS[inverse].fd;
  const haut = (H - PH) / 2, p1 = document.getElementById("plateau"), p2 = document.getElementById("plateau2");
  p1.style.top = p2.style.top = haut + "px";
  const types = { ...SCENES, ...(window.SCENES_SUR_MESURE || {}) }, ctx = { theme: ton, inverse, signature: sc.signature, format, H };
  if (!Array.isArray(sc.scenes) || !sc.scenes.length) throw new Error("le scénario n'a aucune scène");
  let a = 0; const chargements = [];
  const scenes = sc.scenes.map((def, i) => {
    const faire = types[def.type]; if (!faire) throw new Error(`scène ${i + 1} : type inconnu « ${def.type} » (types : ${Object.keys(types).join(", ")})`);
    const s = el("section", "scene " + def.type, def.type === "chute" ? p2 : p1);
    // l'avatar, facultatif : la colonne se resserre avant que la scène mesure ses textes
    let av = null;
    if (def.avatar) {
      if (def.type === "chute") throw new Error(`scène ${i + 1} : pas d'avatar sur la chute (la dernière image reste la phrase et le nom)`);
      s.classList.add("avec-avatar");
      av = el("img", "avatar", s); av.src = encodeURI("file://" + (def.avatar.startsWith("/") ? def.avatar : `${AVATARS}/avatar-${def.avatar}.png`));
      chargements.push(av.decode().catch(() => { throw new Error(`scène ${i + 1} : pose d'avatar introuvable « ${def.avatar} » (fichiers avatar-<pose>.png de ${AVATARS})`); }));
    }
    const jeu = faire(def, s, ctx), d = def.duree || jeu.d + RYTHME.pause, sc1 = { ...jeu, s, a, d, type: def.type, av };
    a += d; return sc1;
  });
  await Promise.all(chargements);
  // la barre de progression du style performance : un segment par scène, qui se remplit pendant sa scène
  const hud = document.getElementById("hud"), logo = document.getElementById("logo"); hud.innerHTML = ""; hud.style.top = haut + 56 + "px";
  // le logo au bout de la barre ; "logo": false dans le scénario l'enlève
  const avecLogo = sc.logo !== false; logo.style.display = avecLogo ? "" : "none"; logo.style.top = haut + 56 - 26 + "px"; hud.style.width = (avecLogo ? 888 - 196 : 888) + "px";
  scenes.forEach((x) => { x.jauge = el("b", "", el("i", "", hud)); });
  const fin = scenes[scenes.length - 1];
  ETAT = { scenes, vivre, voile, hud, logo, lame: document.getElementById("lame"), theme: ton, inverse, duree: a, cap: scenes.length > 1 && fin.voile ? fin.a : a };
  window.image(0);
  return { duree: a, scenes: scenes.map((x) => ({ type: x.type, debut: +x.a.toFixed(2), duree: +x.d.toFixed(2) })), reperes: scenes.flatMap((x) => [x.a + x.d * 0.5, x.a + x.d - 0.45]) };
};
window.image = (T) => {
  const { scenes, vivre, voile, hud, logo, lame, theme, inverse, cap } = ETAT;
  vivre(T, cap);
  let q = 0;
  scenes.forEach((x, i) => {
    const t = T - x.a, dernier = i === scenes.length - 1;
    x.jauge.style.width = clamp(t / x.d) * 100 + "%";
    if (t < 0 || (!dernier && t > x.d)) { x.s.style.opacity = 0; return; }
    const entree = x.voile ? 1 : p(t, 0, 0.3), sortie = dernier ? 0 : p(t, x.d - 0.38, 0.38, E.io);
    x.s.style.opacity = entree * (1 - sortie);
    x.s.style.transform = `translateY(${-sortie * 22}px) scale(${1 + 0.016 * clamp(t / x.d)})`;
    if (x.voile) q = p(t, 0, 0.62, E.io) * (1 - sortie);
    x.jouer(t);
    // l'avatar glisse depuis la droite, net, sans rebond
    if (x.av) { const k = p(t, 0.12, 0.7, E.out5); x.av.style.opacity = k; x.av.style.transform = `translateX(${(1 - k) * 70}px)`; }
  });
  // la chute arrive par un volet en biais, précédé d'une lame terracotta
  const biais = (avance) => { const x = -300 + q * (W + 640) + avance; return `polygon(0 0, ${x + 150}px 0, ${x - 150}px 100%, 0 100%)`; };
  voile.style.clipPath = biais(0); lame.style.clipPath = biais(q > 0 ? 64 : 0);
  poser(hud, q > 0.5 ? inverse : theme);
  poser(logo, q > 0.5 ? inverse : theme);
  return T;
};
// la boîte à outils offerte aux scènes sur mesure (fichier <scénario>.scenes.js)
window.M = { p, E, clamp, el, svgEl, mots, monte, finMonte, apparait, ajuste, tape, typo, nbMots, lecture, TERRA };
})();
</script>
